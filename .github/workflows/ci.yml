name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bin/rails test

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every locale has every key and plural form
        run: npx -y @localheroai/cli check --fail-on any
